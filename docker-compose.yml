services:
  postgres:
    image: postgres:16-alpine
    container_name: ridersclub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ridersclub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ridersclub_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ridersclub_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ridersclub_pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ridersclub} -d ${POSTGRES_DB:-ridersclub_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ridersclub_pgdata:
    name: ridersclub_pgdata

