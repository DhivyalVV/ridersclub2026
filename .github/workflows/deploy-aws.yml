name: Deploy RidersClub to AWS (Manual Approval Only)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target AWS Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod
      aws_region:
        description: 'Target AWS Region'
        required: true
        default: 'ap-south-1'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy-aws:
    name: Build & Deploy API (ECS Fargate) + Remotes (S3/CloudFront)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm 9.15.4
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies & build all packages
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm build

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push @ridersclub/api Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f infrastructure/docker/Dockerfile.api \
            -t "$ECR_REGISTRY/ridersclub-${{ inputs.environment }}-api:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/ridersclub-${{ inputs.environment }}-api:$IMAGE_TAG"

      - name: Sync Shell & 6 Federated Remotes to S3 with Immutable Asset Caching
        env:
          MFE_BUCKET: ${{ secrets.AWS_MFE_S3_BUCKET }}
        run: |
          # Sync Shell Host to root
          aws s3 sync apps/shell/dist "s3://$MFE_BUCKET/" \
            --exclude "index.html" --exclude "remoteEntry*.js" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp apps/shell/dist/index.html "s3://$MFE_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

          # Sync each of the 6 Federated Remotes with zero-cache remoteEntry.js
          for remote in community rides help mechanics garage marketplace; do
            aws s3 sync "apps/$remote/dist" "s3://$MFE_BUCKET/remotes/$remote/" \
              --exclude "remoteEntry.js" \
              --cache-control "public,max-age=31536000,immutable"
            aws s3 cp "apps/$remote/dist/remoteEntry.js" \
              "s3://$MFE_BUCKET/remotes/$remote/remoteEntry.js" \
              --cache-control "no-cache,no-store,must-revalidate"
          done

      - name: Invalidate CloudFront index.html & remoteEntry.js manifests
        env:
          CF_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CF_DISTRIBUTION_ID" \
            --paths "/index.html" "/remotes/*/remoteEntry.js"

